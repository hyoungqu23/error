# CI 게이트 (RFC §8-3, P7 도입 → P8에서 워크스페이스 전체로 확장).
# 수렴(P0–P8) 완료 — 단일 시스템: error-core ← error-adapters ← error-next ← error-architecture.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@11.x)에서 버전을 읽는다
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11은 Node ≥ 22.13 요구(node:sqlite)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test lint build # build: next build만 잡는 회귀(RSC 경계·빌드타임 제약)도 게이트
